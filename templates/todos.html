{% extends "base.html" %}
{% block content %}
    <nav><a href="/lists">← Back to Lists</a> | <a href="/logout">Logout</a></nav>
    <h1>{{ list.title }}</h1>

    <form method="post" action="/lists/{{ list.id }}/add" style="display: flex; gap: 10px;">
        <input type="text" name="text" placeholder="Add a task..." required>
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for todo in list.items %}
        <li>
            <div class="todo-item">
                <form method="post" action="/todos/{{ todo.id }}/toggle">
                    <button type="submit" class="btn-ghost">
                        {% if todo.done %}✅{% else %}⬜{% endif %}
                    </button>
                </form>
                <span class="{% if todo.done %}done{% endif %}">{{ todo.text }}</span>
            </div>
            <form method="post" action="/todos/{{ todo.id }}/delete">
                <button type="submit" class="btn-delete">🗑️</button>
            </form>
        </li>
        {% endfor %}
    </ul>
{% endblock %}
